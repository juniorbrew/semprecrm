# Edge proxy for the local test server. One published port (3101):
#   /supabase/*  → the Supabase CLI stack on the host (REST, auth, storage,
#                  realtime WebSocket) — so the browser never needs a second
#                  port or a fixed IP; NEXT_PUBLIC_SUPABASE_URL is just "/supabase".
#   /*           → the Next.js app container.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 3101;
  server_name _;
  client_max_body_size 64m;

  location /supabase/ {
    proxy_pass http://host.docker.internal:56021/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://semprecrm:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
  }
}
