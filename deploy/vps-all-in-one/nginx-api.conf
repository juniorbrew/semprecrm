# /etc/nginx/sites-available/semprecrm-api
# Host público do Supabase (API REST, Auth, Storage, Realtime e Studio).
# O gateway do Supabase escuta em 127.0.0.1:8000; o Nginx só termina o TLS.
#
# Só os caminhos que o app, o wa-gateway e os navegadores usam ficam públicos:
# /auth/v1, /rest/v1, /storage/v1, /realtime/v1, /functions/v1, /graphql/v1 e
# /mail/ (modelos de e-mail, seção 8 do README). Todo o resto, ou seja o Studio
# (painel em "/", com /api/* e /pg/* internos), só abre para os IPs liberados em
# $semprecrm_studio_allowed abaixo. Padrão: ninguém de fora; use um túnel SSH
#   ssh -L 8000:127.0.0.1:8000 semprecrm   ->  http://localhost:8000
# ou acrescente o seu IP fixo no bloco geo.

geo $semprecrm_studio_allowed {
    default     0;
    127.0.0.1   1;
    # 203.0.113.10  1;   # SEU.IP.FIXO — libera o Studio pela internet para este IP
}

# Login, cadastro, recuperação de senha e OTP vão do navegador direto para o
# GoTrue. Ele já tem limites próprios; este é uma segunda barreira por IP, com
# folga para escritórios atrás de um único IP (refresh de sessão também passa
# por /auth/v1/token).
limit_req_zone $binary_remote_addr zone=semprecrm_api_auth:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.seudominio.com.br;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.seudominio.com.br;
    server_tokens off;
    limit_req_status 429;

    ssl_certificate     /etc/letsencrypt/live/api.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.seudominio.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 50m;   # uploads para o Storage (mídia do chat, avatares)

    # Realtime usa WebSocket.
    location /realtime/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Endpoints de autenticação sujeitos a força bruta (antes do bloco geral:
    # o primeiro regex que casa vence).
    location ~ ^/auth/v1/(token|signup|recover|otp|magiclink|verify|resend|factors) {
        limit_req zone=semprecrm_api_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # APIs públicas do Supabase (exigem a apikey/JWT no próprio gateway).
    location ~ ^/(auth|rest|storage|functions|graphql)/v1(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Studio e qualquer outro caminho do gateway: só IPs liberados no geo acima.
    # Além disso continua valendo o usuário/senha DASHBOARD_* do .env.
    location / {
        if ($semprecrm_studio_allowed = 0) { return 403; }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
