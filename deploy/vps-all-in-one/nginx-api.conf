# /etc/nginx/sites-available/semprecrm-api
# Host público do Supabase (API REST, Auth, Storage, Realtime e Studio).
# O gateway do Supabase escuta em 127.0.0.1:8000; o Nginx só termina o TLS.
# Studio fica em https://api.../ protegido pelo usuário/senha DASHBOARD_* do .env.
# Restrinja o acesso ao Studio por IP se possível (bloco "allow" abaixo).

server {
    listen 80;
    listen [::]:80;
    server_name api.seudominio.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.seudominio.com.br;

    ssl_certificate     /etc/letsencrypt/live/api.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.seudominio.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 50m;   # uploads para o Storage (mídia do chat, avatares)

    # Realtime usa WebSocket.
    location /realtime/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Studio (painel de administração). Descomente e ajuste para limitar por IP.
    # location = / { allow SEU.IP.FIXO; deny all; proxy_pass http://127.0.0.1:8000; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
