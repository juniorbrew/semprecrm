# /etc/nginx/sites-available/semprecrm  ->  ln -s into sites-enabled
# Replace crm.seudominio.com.br with the real hostname. HTTPS is mandatory:
# the Meta webhook only calls https:// and the app sends HSTS.
# Certificates: sudo certbot --nginx -d crm.seudominio.com.br

# Rate limits (this file is included inside http {}, so the zones live here).
# Login/signup/password reset go browser -> Supabase (api host, see
# deploy/vps-all-in-one/nginx-api.conf); on this host the public, unauthenticated
# endpoints that can be abused are the marketing contact form and the
# invitation links. Values are per client IP and far above normal use.
limit_req_zone $binary_remote_addr zone=semprecrm_contact:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=semprecrm_auth:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name crm.seudominio.com.br;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.seudominio.com.br;
    server_tokens off;
    limit_req_status 429;

    ssl_certificate     /etc/letsencrypt/live/crm.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.seudominio.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 25m;   # chat media / CSV import uploads

    # Responses that set the Supabase session (login, /auth/callback from
    # an e-mail link) carry several KB of Set-Cookie headers; the 4k
    # default makes Nginx answer 502 "upstream sent too big header".
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Long-lived cache for hashed Next assets; everything else passes through
    # untouched so the app's own Cache-Control headers apply.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cron endpoints: semprecrm-cron (scripts/cron-tick.mjs) calls them on
    # http://127.0.0.1:3000 directly, so nginx is never in that path. From the
    # internet they are refused before reaching the app (they still check
    # x-cron-secret; this is defence in depth).
    location ~ ^/api/(automations|flows|ai/auto-reply|support/sla|support/csat)/cron(/|$) {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
    # Calendar sync cron (POST, same loop). /sync/me is the user's "sync now"
    # button and stays public.
    location = /api/integrations/calendar/sync {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # X-Forwarded-For is set to the client address only (not appended): the
    # app must never trust an address the client wrote itself. X-Real-IP is
    # the header the app prefers.
    location = /api/marketing/contact {
        limit_req zone=semprecrm_contact burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
    location ~ ^/api/(invitations|auth)/ {
        limit_req zone=semprecrm_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;   # Supabase realtime runs
        proxy_set_header Connection        "upgrade";       # browser->Supabase, but keep for HMR/SSE
        proxy_read_timeout 120s;
    }
}
